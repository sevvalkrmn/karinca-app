<script>
        // Simple micro-interaction for the mascot container
        const mascotBox = document.querySelector('.relative.w-48');
        mascotBox.addEventListener('mousemove', (e) => {
            const { left, top, width, height } = mascotBox.getBoundingClientRect();
            const x = (e.clientX - left) / width - 0.5;
            const y = (e.clientY - top) / height - 0.5;
            mascotBox.style.transform = `perspective(500px) rotateY(${x * 10}deg) rotateX(${-y * 10}deg)`;
        });

        mascotBox.addEventListener('mouseleave', () => {
            mascotBox.style.transform = `perspective(500px) rotateY(0deg) rotateX(0deg)`;
            mascotBox.style.transition = 'transform 0.5s ease';
        });
    </script>
