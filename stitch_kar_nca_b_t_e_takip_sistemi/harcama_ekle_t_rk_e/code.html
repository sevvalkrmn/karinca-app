<script>
        let currentAmount = "0";

        function appendNumber(num) {
            if (currentAmount === "0" && num !== ".") {
                currentAmount = num;
            } else {
                if (num === "." && currentAmount.includes(".")) return;
                currentAmount += num;
            }
            updateDisplay();
        }

        function clearAmount() {
            if (currentAmount.length > 1) {
                currentAmount = currentAmount.slice(0, -1);
            } else {
                currentAmount = "0";
            }
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('amount-display').innerText = currentAmount;
        }

        function selectCategory(el) {
            document.querySelectorAll('.category-chip').forEach(chip => {
                chip.classList.remove('active');
                chip.querySelector('span.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
                chip.querySelector('span.material-symbols-outlined').classList.replace('text-primary', 'text-on-surface-variant');
            });
            el.classList.add('active');
            el.querySelector('span.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
            el.querySelector('span.material-symbols-outlined').classList.replace('text-on-surface-variant', 'text-primary');
        }

        // Switch Logic
        const btnExpense = document.getElementById('btn-expense');
        const btnIncome = document.getElementById('btn-income');

        btnExpense.addEventListener('click', () => {
            btnExpense.className = "flex-1 py-2 rounded-full font-label-md text-label-md bg-primary text-on-primary transition-all";
            btnIncome.className = "flex-1 py-2 rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface-variant transition-all";
        });

        btnIncome.addEventListener('click', () => {
            btnIncome.className = "flex-1 py-2 rounded-full font-label-md text-label-md bg-secondary text-on-primary transition-all";
            btnExpense.className = "flex-1 py-2 rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface-variant transition-all";
        });
    </script>
