<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

<body class="bg-background text-on-background min-h-screen flex flex-col items-center overflow-x-hidden">
<!-- Top Navigation Bar -->
<header class="w-full top-0 bg-background flex items-center justify-between px-container-margin h-16 z-10">
<button class="text-primary hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-display-lg text-display-lg text-primary">karınca</span>
<div class="w-6"></div> <!-- Spacer for balance -->
</header>
<main class="flex-1 w-full max-w-[1200px] px-container-margin py-lg flex flex-col">
<!-- Onboarding Progress -->
<div class="flex gap-2 mb-xl justify-center">
<div class="h-1.5 w-12 rounded-full bg-surface-container-highest"></div>
<div class="h-1.5 w-12 rounded-full bg-primary shadow-sm"></div>
<div class="h-1.5 w-12 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Header Section -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-sm">Harcama Limitiniz</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto">Aylık gelirinin ne kadarını harcamak istiyorsun? Kendine bir limit belirle.</p>
</div>
<!-- Central Mascot Context -->
<div class="relative flex justify-center mb-xl group">

<div class="w-40 h-40 md:w-56 md:h-56 relative bg-surface-container rounded-full flex items-center justify-center overflow-visible">
<img alt="Karınca Mascot" class="w-full h-full object-contain transform group-hover:scale-105 transition-transform duration-300" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBo9XKepXxtE94sZ4XxxC1nzYOtZjcBFhZ38p6aHKyY1om3wP5BzGkZKh3jTbW8f96Cr04YUnkXElO_zq-jI3Lw1kUcz1HChueU1rD2bkprmJRtdGDwqKgncFXGo2KmpIYx1K1SjSQWqL6rEQzWr7knFICVP0X0YNM-kgqjj_ZEnzjYOsELUjm9stwCsV_6d7bNU4rdqCMGlVOEwM9tLzuTerjAvfWKlRIfIgmilP61p4Ok_c0Rkpw19Dqs-fb3Xow85jwpncn-HiB8">
</div>
</div>
<!-- Interactive Spending Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-md border border-surface-container-low max-w-md mx-auto w-full mb-3xl">
<div class="flex flex-col gap-lg">
<!-- Input Field -->
<div class="relative">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs ml-base" for="limit">AYLIK HARCAMA LİMİTİ</label>
<div class="relative group">
<span class="absolute left-md top-1/2 -translate-y-1/2 text-primary font-headline-md text-headline-md">₺</span>
<input class="w-full bg-surface py-4 pl-12 pr-md rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary font-headline-md text-headline-md text-on-surface transition-all" id="limit" placeholder="00.00" type="number" value="3500">
</div>
</div>
<!-- Visual Ratio Container -->
<div class="space-y-md">
<div class="flex justify-between font-label-md text-label-md">
<span class="text-primary flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">shopping_basket</span> Harcama
                        </span>
<span class="text-secondary flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">savings</span> Birikim
                        </span>
</div>
<!-- Progress Bar Component -->
<div class="relative h-6 bg-surface-container-highest rounded-full overflow-hidden flex shadow-inner">
<div class="h-full bg-primary-container transition-all duration-500 ease-out flex items-center justify-end px-3" id="spending-bar" style="width: 70%;">
<span class="text-[10px] font-bold text-white">%70</span>
</div>
<div class="h-full bg-secondary-container transition-all duration-500 ease-out flex items-center justify-start px-3" id="saving-bar" style="width: 30%;">
<span class="text-[10px] font-bold text-secondary">%30</span>
</div>
</div>
<!-- Range Slider -->
<div class="pt-sm px-xs">
<input class="progress-thumb w-full h-2 bg-surface-container rounded-full appearance-none cursor-pointer" id="ratio-slider" max="100" min="0" type="range" value="70">
</div>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant italic">
                        Tahmini Aylık Gelir: ₺5,000
                    </p>
</div>
</div>
</div>
<!-- Footer Action -->
<div class="mt-auto pb-xl flex flex-col items-center">
<button class="w-full max-w-sm bg-primary text-on-primary py-4 rounded-full font-headline-md text-headline-md shadow-lg active:scale-95 transition-all duration-200 hover:opacity-90">
                Devam Et
            </button>
<p class="mt-md font-label-sm text-label-sm text-on-surface-variant">
                Daha sonra ayarlardan değiştirebilirsin.
            </p>
</div>
</main>
<script>
        const slider = document.getElementById('ratio-slider');
        const limitInput = document.getElementById('limit');
        const spendingBar = document.getElementById('spending-bar');
        const savingBar = document.getElementById('saving-bar');
        const income = 5000;

        function updateVisuals(spendingPercent) {
            const spendingVal = Math.round((income * spendingPercent) / 100);
            limitInput.value = spendingVal;
            
            spendingBar.style.width = spendingPercent + '%';
            savingBar.style.width = (100 - spendingPercent) + '%';
            
            spendingBar.querySelector('span').innerText = `%${spendingPercent}`;
            savingBar.querySelector('span').innerText = `%${100 - spendingPercent}`;

            // Adjust colors based on health
            if(spendingPercent > 80) {
                spendingBar.className = "h-full bg-error transition-all duration-500 ease-out flex items-center justify-end px-3";
            } else {
                spendingBar.className = "h-full bg-primary-container transition-all duration-500 ease-out flex items-center justify-end px-3";
            }
        }

        slider.addEventListener('input', (e) => {
            updateVisuals(e.target.value);
        });

        limitInput.addEventListener('input', (e) => {
            const val = parseInt(e.target.value) || 0;
            const percent = Math.min(Math.max(Math.round((val / income) * 100), 0), 100);
            slider.value = percent;
            
            spendingBar.style.width = percent + '%';
            savingBar.style.width = (100 - percent) + '%';
            spendingBar.querySelector('span').innerText = `%${percent}`;
            savingBar.querySelector('span').innerText = `%${100 - percent}`;
        });
    </script>


</body></html>
