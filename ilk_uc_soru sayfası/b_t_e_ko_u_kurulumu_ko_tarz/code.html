            width: 24px;

<body class="bg-background min-h-screen flex flex-col text-on-background">
<!-- Top Navigation (Shell suppressed for onboarding, only back button shown as requested by logic) -->
<header class="flex items-center justify-between px-container-margin h-16 w-full bg-background">
<button class="text-primary hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex items-center gap-1">
<div class="h-2 w-2 rounded-full bg-outline-variant progress-dot"></div>
<div class="h-2 w-2 rounded-full bg-outline-variant progress-dot"></div>
<div class="h-2 w-2 rounded-full bg-primary progress-dot active transition-all duration-300"></div>
</div>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 flex flex-col px-container-margin pb-xl max-w-lg mx-auto w-full">
<!-- Mascot Section -->
<div class="mt-8 mb-6 flex justify-center relative h-48">
<div class="absolute inset-0 flex items-center justify-center opacity-10">
<div class="w-64 h-64 bg-primary rounded-full blur-3xl"></div>
</div>
<img alt="Karınca Mascot" class="h-full object-contain relative z-10 animate-bounce transition-transform duration-500" id="mascot-img" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6iEj02ANaBQuSnzNEjca1SuvQgbu5VCiS1KWhXG1kKPsxSX9ZKrrcL5SXGaj7E9Nh0u-1Wwh_I8GmqAzV9URfFQhxtjNQymW4itEOUvSH2R54N0S5RvlMCne1SsnhlslLOnfhGz9NvzpclKDg3n-SqF5PMFysMvuJ083I-TkE9H-OyfJlk89BpQM6WogUy0zcI1gRKofLBsVIKvS6BLCgnOgsCZ8WhTA_l4aPBFu4G40NnIeu8YK8g6GmBHcCp3ekAPge07FjSH0O">
</div>
<!-- Header -->
<div class="text-center mb-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Koçluk Tarzı</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Karınca Ko-çu sana nasıl hitap etsin? Senin için en uygun tonu seç.</p>
</div>
<!-- Selection Cards -->
<div class="space-y-4">
<!-- Gentle Option -->
<button class="selection-card w-full p-4 bg-surface-container-lowest rounded-xl border-2 border-transparent flex items-center gap-4 text-left transition-all duration-200 hover:border-outline-variant" id="btn-yumusak" onclick="selectTone('yumusak')">
<div class="icon-container h-12 w-12 rounded-full bg-surface-container flex items-center justify-center text-primary-container shrink-0 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div class="flex-1">
<h3 class="font-label-md text-label-md text-on-surface">Yumuşak</h3>
<p class="text-[13px] leading-tight text-on-surface-variant mt-1">Seni kırmadan, nazikçe hatırlatmalar yapan tatlı dilli bir dost.</p>
</div>
<div class="radio-indicator w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="dot w-2.5 h-2.5 rounded-full bg-primary hidden"></div>
</div>
</button>
<!-- Balanced Option (Default Active) -->
<button class="selection-card active w-full p-4 bg-surface-container-lowest rounded-xl border-2 border-transparent flex items-center gap-4 text-left transition-all duration-200 hover:border-outline-variant" id="btn-dengeli" onclick="selectTone('dengeli')">
<div class="icon-container h-12 w-12 rounded-full bg-primary flex items-center justify-center text-white shrink-0 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">balance</span>
</div>
<div class="flex-1">
<h3 class="font-label-md text-label-md text-on-surface">Dengeli</h3>
<p class="text-[13px] leading-tight text-on-surface-variant mt-1">Yeri geldiğinde tebrik eden, gerektiğinde profesyonel uyarılar yapan koç.</p>
</div>
<div class="radio-indicator w-5 h-5 rounded-full border-2 border-primary flex items-center justify-center">
<div class="dot w-2.5 h-2.5 rounded-full bg-primary block"></div>
</div>
</button>
<!-- Strict Option -->
<button class="selection-card w-full p-4 bg-surface-container-lowest rounded-xl border-2 border-transparent flex items-center gap-4 text-left transition-all duration-200 hover:border-outline-variant" id="btn-sert" onclick="selectTone('sert')">
<div class="icon-container h-12 w-12 rounded-full bg-surface-container flex items-center justify-center text-primary-container shrink-0 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">gavel</span>
</div>
<div class="flex-1">
<h3 class="font-label-md text-label-md text-on-surface">Sert</h3>
<p class="text-[13px] leading-tight text-on-surface-variant mt-1">Disipline önem veren, bütçeni aşmanı engelleyen kararlı bir otorite.</p>
</div>
<div class="radio-indicator w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="dot w-2.5 h-2.5 rounded-full bg-primary hidden"></div>
</div>
</button>
</div>
<!-- Submit Button -->
<div class="mt-auto pt-xl">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
                Kurulumu Tamamla
                <span class="material-symbols-outlined">check_circle</span>
</button>
</div>
</main>
<script>
        function selectTone(tone) {
            // Remove active classes
            document.querySelectorAll('.selection-card').forEach(card => {
                card.classList.remove('active', 'border-primary');
                card.classList.add('border-transparent');
                
                const iconBox = card.querySelector('.icon-container');
                iconBox.classList.remove('bg-primary', 'text-white');
                iconBox.classList.add('bg-surface-container', 'text-primary-container');
                
                const radio = card.querySelector('.radio-indicator');
                radio.classList.remove('border-primary');
                radio.classList.add('border-outline-variant');
                radio.querySelector('.dot').classList.add('hidden');
                radio.querySelector('.dot').classList.remove('block');
            });

            // Add active classes to selected
            const activeCard = document.getElementById('btn-' + tone);
            activeCard.classList.add('active', 'border-primary');
            activeCard.classList.remove('border-transparent');
            
            const activeIconBox = activeCard.querySelector('.icon-container');
            activeIconBox.classList.add('bg-primary', 'text-white');
            activeIconBox.classList.remove('bg-surface-container', 'text-primary-container');
            
            const activeRadio = activeCard.querySelector('.radio-indicator');
            activeRadio.classList.add('border-primary');
            activeRadio.classList.remove('border-outline-variant');
            activeRadio.querySelector('.dot').classList.remove('hidden');
            activeRadio.querySelector('.dot').classList.add('block');

            // Mascot Reaction Interaction
            const mascot = document.getElementById('mascot-img');
            mascot.style.transform = 'scale(1.1)';
            setTimeout(() => {
                mascot.style.transform = 'scale(1)';
            }, 200);

            // Add specific animation logic based on tone
            if (tone === 'sert') {
                mascot.classList.add('grayscale-[0.5]');
                mascot.style.filter = 'brightness(0.9)';
            } else if (tone === 'yumusak') {
                mascot.classList.remove('grayscale-[0.5]');
                mascot.style.filter = 'drop-shadow(0 0 10px rgba(224, 78, 55, 0.2))';
            } else {
                mascot.classList.remove('grayscale-[0.5]');
                mascot.style.filter = 'none';
            }
        }
    </script>
